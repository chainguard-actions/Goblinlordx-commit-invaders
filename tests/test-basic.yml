name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          github_user_name: octocat
          output_branch: output
          output_file: commit-invaders.svg

      - name: Assert action ran and produced outputs or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SVG_FILE: ${{ steps.action.outputs.svg_file }}
          SVG_SIZE: ${{ steps.action.outputs.svg_size }}
          TOTAL_COMMITS: ${{ steps.action.outputs.total_commits }}
          ANIMATION_DURATION: ${{ steps.action.outputs.animation_duration }}
        run: |
          echo "outcome: $OUTCOME"
          echo "svg_file: $SVG_FILE"
          echo "svg_size: $SVG_SIZE"
          echo "total_commits: $TOTAL_COMMITS"
          echo "animation_duration: $ANIMATION_DURATION"

          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SVG_FILE" ]; then
              echo "FAIL: action succeeded but svg_file output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with svg_file='$SVG_FILE'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (likely due to sentinel repo or API limits)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
