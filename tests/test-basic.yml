name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: fake-token-for-act-testing
          github_user_name: octocat
        continue-on-error: true
      - name: Assert action ran (outcome is success or failure, not skipped/cancelled)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ] || [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was skipped or cancelled, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
      - name: Assert action failed gracefully (expected in act without real GitHub API)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no real GitHub API in act)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (real API was available)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
