name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify dist/index.cjs exists
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/dist/index.cjs" ]; then
            echo "FAIL: dist/index.cjs not found"
            exit 1
          fi
          echo "PASS: dist/index.cjs exists ($(du -sh dist/index.cjs | cut -f1))"
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          github_user_name: octocat
        continue-on-error: true
      - name: Assert action ran (expected to fail without real API access)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action is expected to fail because act cannot make real GitHub API calls.
          # We verify it ran and produced a known outcome (failure or success).
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with outcome=$OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Assert svg_file output or graceful failure
        env:
          SVG_FILE: ${{ steps.action.outputs.svg_file }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "svg_file: $SVG_FILE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SVG_FILE" ]; then
              echo "FAIL: action succeeded but svg_file output is empty"
              exit 1
            fi
            echo "PASS: svg_file=$SVG_FILE"
          else
            echo "PASS: action failed gracefully (expected without real GitHub API access)"
          fi
