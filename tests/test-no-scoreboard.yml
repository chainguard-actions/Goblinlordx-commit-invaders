name: Test no scoreboard option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Configure git identity
        run: |
          git config user.name "test-bot"
          git config user.email "test-bot@example.com"
      - name: Set up local git remote
        run: |
          git init --bare /tmp/origin.git
          git remote add origin /tmp/origin.git || git remote set-url origin /tmp/origin.git
      - id: action
        uses: .
        with:
          github_token: fake-token-for-testing
          github_user_name: octocat
          output_branch: output
          output_file: commit-invaders-no-score.svg
          no_scoreboard: 'true'
        continue-on-error: true
      - name: Assert action failed gracefully with invalid token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # With a fake token the GitHub GraphQL API will reject the request.
          # The action should fail (not crash the runner) and set outcome=failure.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action failed gracefully as expected with no_scoreboard=true"
