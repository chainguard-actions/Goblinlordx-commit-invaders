name: Test no scoreboard
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up local git remote to allow push
        run: |
          # Create a bare repo to act as origin so the action's git push succeeds
          git init --bare /tmp/origin-repo.git
          git remote remove origin 2>/dev/null || true
          git remote add origin /tmp/origin-repo.git
          git push origin HEAD:main --force
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          github_user_name: octocat
          output_file: no-scoreboard-invaders.svg
          no_scoreboard: 'true'
      - name: Assert svg_file output is set
        env:
          ACTUAL: ${{ steps.action.outputs.svg_file }}
        run: |
          echo "svg_file: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: svg_file output is empty"
            exit 1
          fi
          echo "PASS: svg_file=$ACTUAL"
      - name: Assert SVG file exists on disk
        env:
          SVG_FILE: ${{ steps.action.outputs.svg_file }}
        run: |
          echo "Checking for SVG file: $SVG_FILE"
          if [ ! -f "$SVG_FILE" ]; then
            echo "FAIL: SVG file not found at $SVG_FILE"
            exit 1
          fi
          echo "PASS: SVG file exists"
      - name: Assert SVG file contains SVG content
        env:
          SVG_FILE: ${{ steps.action.outputs.svg_file }}
        run: |
          if ! grep -q '<svg' "$SVG_FILE"; then
            echo "FAIL: file does not appear to be an SVG"
            exit 1
          fi
          echo "PASS: file contains SVG content"
      - name: Assert svg_size is a positive number
        env:
          ACTUAL: ${{ steps.action.outputs.svg_size }}
        run: |
          echo "svg_size: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: svg_size output is empty"
            exit 1
          fi
          if ! [[ "$ACTUAL" =~ ^[0-9]+$ ]]; then
            echo "FAIL: svg_size is not a number: $ACTUAL"
            exit 1
          fi
          if [ "$ACTUAL" -le 0 ]; then
            echo "FAIL: svg_size should be greater than 0, got $ACTUAL"
            exit 1
          fi
          echo "PASS: svg_size=$ACTUAL"
