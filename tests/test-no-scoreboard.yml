name: Test no scoreboard option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Configure git identity and local remote for push
        run: |
          git config user.name "commit-invaders[bot]"
          git config user.email "commit-invaders[bot]@users.noreply.github.com"
          # Use a local bare repo as the remote so git push always succeeds
          git init --bare /tmp/local-remote.git
          git remote set-url origin /tmp/local-remote.git
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          github_user_name: octocat
          output_branch: output-test-no-scoreboard
          output_file: commit-invaders-no-score.svg
          no_scoreboard: 'true'
      - name: Assert svg_file output is set
        env:
          ACTUAL: ${{ steps.action.outputs.svg_file }}
        run: |
          echo "actual svg_file: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: svg_file output is empty"
            exit 1
          fi
          echo "PASS: svg_file=$ACTUAL"
      - name: Assert svg_size output is set and positive
        env:
          ACTUAL: ${{ steps.action.outputs.svg_size }}
        run: |
          echo "actual svg_size: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: svg_size output is empty"
            exit 1
          fi
          if [ "$ACTUAL" -le 0 ] 2>/dev/null; then
            echo "FAIL: svg_size should be positive, got $ACTUAL"
            exit 1
          fi
          echo "PASS: svg_size=$ACTUAL"
      - name: Assert total_commits output is set
        env:
          ACTUAL: ${{ steps.action.outputs.total_commits }}
        run: |
          echo "actual total_commits: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: total_commits output is empty"
            exit 1
          fi
          echo "PASS: total_commits=$ACTUAL"
      - name: Assert animation_duration output is set
        env:
          ACTUAL: ${{ steps.action.outputs.animation_duration }}
        run: |
          echo "actual animation_duration: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: animation_duration output is empty"
            exit 1
          fi
          echo "PASS: animation_duration=$ACTUAL"
      - name: Assert SVG file contains SVG content
        env:
          SVG_FILE: ${{ steps.action.outputs.svg_file }}
        run: |
          echo "Checking SVG content in: $SVG_FILE"
          FOUND=0
          for candidate in "$SVG_FILE" "commit-invaders-no-score.svg"; do
            if [ -f "$candidate" ] && grep -q '<svg' "$candidate"; then
              echo "PASS: file contains SVG content at $candidate"
              FOUND=1
              break
            fi
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "FAIL: SVG file not found or does not contain SVG content"
            ls -la || true
            exit 1
          fi
      - name: Assert SVG does not contain scoreboard elements
        env:
          SVG_FILE: ${{ steps.action.outputs.svg_file }}
        run: |
          echo "Checking that scoreboard is absent..."
          # Determine which file to check
          CHECK_FILE="$SVG_FILE"
          if [ ! -f "$CHECK_FILE" ]; then
            CHECK_FILE="commit-invaders-no-score.svg"
          fi
          if [ ! -f "$CHECK_FILE" ]; then
            echo "FAIL: SVG file not found"
            exit 1
          fi
          # When no_scoreboard=true, high score board should not appear
          if grep -qi 'high.score\|scoreboard\|hiscore' "$CHECK_FILE"; then
            echo "FAIL: scoreboard content found in SVG when no_scoreboard=true"
            exit 1
          fi
          echo "PASS: no scoreboard content found"
