name: Test custom output file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          github_user_name: "octocat"
          output_branch: "output"
          output_file: "my-custom-invaders.svg"

      - name: Assert action ran with custom output file
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SVG_FILE: ${{ steps.action.outputs.svg_file }}
          SVG_SIZE: ${{ steps.action.outputs.svg_size }}
          TOTAL_COMMITS: ${{ steps.action.outputs.total_commits }}
          ANIMATION_DURATION: ${{ steps.action.outputs.animation_duration }}
        run: |
          echo "outcome: $OUTCOME"
          echo "svg_file: $SVG_FILE"
          echo "svg_size: $SVG_SIZE"
          echo "total_commits: $TOTAL_COMMITS"
          echo "animation_duration: $ANIMATION_DURATION"

          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SVG_FILE" ]; then
              echo "FAIL: action succeeded but svg_file output is empty"
              exit 1
            fi
            # Verify the output file name matches what we requested
            BASENAME="$(basename "$SVG_FILE")"
            echo "basename: $BASENAME"
            if [ "$BASENAME" != "my-custom-invaders.svg" ]; then
              echo "FAIL: expected output file 'my-custom-invaders.svg' but got '$BASENAME'"
              exit 1
            fi
            echo "PASS: action succeeded with custom output file '$SVG_FILE'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (likely sentinel repo or API limitation)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
