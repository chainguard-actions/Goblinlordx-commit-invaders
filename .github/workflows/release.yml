name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'  # semver only — ignores v1 major tag

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@^11.10.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Publish to npm (skip if version already exists)
      - name: Publish to npm
        run: npm publish --access public || echo "::warning::npm publish skipped — version may already exist"

      # Create GitHub release (auto-updates Marketplace listing)
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true

      # Update v1 major tag
      - run: |
          git config user.name "commit-invaders[bot]"
          git config user.email "commit-invaders[bot]@users.noreply.github.com"
          git tag -fa v1 -m "v1"
          git push origin v1 --force
